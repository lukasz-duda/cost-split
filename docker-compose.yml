services:
  app:
    build: .
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      ADMIN_TOKEN: ${ADMIN_TOKEN:-change-me}
      APP_URL: ${APP_URL:-}
      DB_HOST: db
      DB_NAME: costsplit
      DB_USER: costsplit
      DB_PASSWORD: ${DB_PASSWORD:-costsplit}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:5.7
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: costsplit
      MYSQL_USER: costsplit
      MYSQL_PASSWORD: ${DB_PASSWORD:-costsplit}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - db-data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  db-data:
